[project]
name = "pokemon-tcg-ai-battle"
version = "0.1.0"
description = "Behavior-cloned and reinforcement-learned policy for Pokemon TCG AI Battle"
requires-python = ">=3.11"
dependencies = [
  "kaggle>=2.2.3",
  "kagglehub>=1.0.0",
  "kagglesdk>=0.1.33,<1.0",
  "requests",
  "python-dotenv",
]

[project.optional-dependencies]
rl = [
  "numpy<2",
  "orjson==3.11.5",
  "torch>=2.2",
  "tensorboard>=2.14",
]
tracking = [
  "wandb>=0.28,<1",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "pokemon_tcg_ai*",
]

[tool.setuptools.package-data]
pokemon_tcg_ai = ["assets/**/*", "cuda_engine_2/*.json", "semantic_runtime/**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
