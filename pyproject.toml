[project]
name = "pokemon-tcg-ai-battle-research"
version = "0.1.0"
description = "Research and coordination workspace for the Kaggle PTCG AI Battle Simulation competition"
requires-python = ">=3.11"
dependencies = [
  "kaggle>=2.2.3",
  "kagglehub>=1.0.0",
  "kagglesdk>=0.1.33,<1.0",
  "requests",
  "python-dotenv",
]

[project.optional-dependencies]
rl = [
  "numpy<2",
  "orjson==3.11.5",
  "torch>=2.2",
  "tensorboard>=2.14",
]
tracking = [
  "wandb>=0.28,<1",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = [
  "rl_environment*",
  "train*",
  "evaluation*",
  "visualization*",
]
